<title>EXP-003 Static Control</title>

<style>

:root {
  color-scheme: dark;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(40, 55, 90, 0.28),
      transparent 38%
    ),
    #05070b;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

.shell {
  width: min(94vw, 1080px);
  padding: 36px;
}

.header {
  text-align: center;
  margin-bottom: 26px;
}

.kicker {
  opacity: 0.55;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 12px;
}

h1 {
  margin: 10px 0 8px;
  font-size: clamp(27px, 4vw, 48px);
  line-height: 1.05;
}

.subtitle {
  color: rgba(255,255,255,0.62);
  max-width: 760px;
  margin: 0 auto;
  line-height: 1.55;
}

.stage {
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.035);
  box-shadow:
    0 30px 80px rgba(0,0,0,0.55),
    inset 0 1px rgba(255,255,255,0.08);
}

.stage img {
  display: block;
  width: 100%;
  height: auto;
  user-select: none;
}

.footer {
  text-align: center;
  margin-top: 18px;
  color: rgba(255,255,255,0.42);
  font-size: 12px;
}

</style>
</head>
